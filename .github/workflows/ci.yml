name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: academic_complaints
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d academic_complaints"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Cache OWASP Dependency-Check DB
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: ${{ runner.os }}-dependency-check-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-dependency-check-

      - name: Maven Tests and Coverage
        working-directory: backend
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/academic_complaints
          DATABASE_USERNAME: postgres
          DATABASE_PASSWORD: postgres
          AI_PROVIDER: simulation
        run: mvn -B test jacoco:report

      - name: Checkstyle Code Quality
        working-directory: backend
        run: mvn -B checkstyle:check

      - name: SpotBugs Static Analysis
        working-directory: backend
        run: mvn -B spotbugs:check

      - name: Maven Verify (Integration Tests & Quality Gate)
        working-directory: backend
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/academic_complaints
          DATABASE_USERNAME: postgres
          DATABASE_PASSWORD: postgres
          AI_PROVIDER: simulation
        run: mvn -B verify -DskipTests

      - name: OWASP Dependency Vulnerability Scan
        working-directory: backend
        run: mvn -B dependency-check:check -DfailOnError=false

      - name: Upload Maven and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            backend/target/site/jacoco/
            backend/target/surefire-reports/
            backend/target/checkstyle-result.xml
            backend/target/spotbugsXml.xml
            backend/target/dependency-check-report.html

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and validate
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
      - name: Upload frontend artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-artifacts
          path: |
            frontend/dist/
            frontend/coverage/

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build application image
        run: docker build -f infra/Dockerfile -t buzon-ucc:${{ github.sha }} .
